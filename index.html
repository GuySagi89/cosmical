<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cosmos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <canvas id="globe-canvas"></canvas>

  <div id="gadget-inventory">
    <div class="gadget-slot" data-gadget="blackhole" id="gadget-blackhole">
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Black Hole</span>
        <span class="gadget-tooltip-hint">Click to place</span>
      </div>
    </div>
    <div class="gadget-slot" data-gadget="spaceship" id="gadget-spaceship">
      <svg class="gadget-ship-icon" viewBox="-13 -16 26 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,-15 -12,7 -5,2 0,11 5,2 12,7"
          fill="#6848b8" fill-opacity="0.93"
          stroke="#c0a8ff" stroke-width="1.3" stroke-linejoin="round"/>
        <ellipse cx="0" cy="-6" rx="2.5" ry="4.5"
          fill="#98dcff" fill-opacity="0.90"
          stroke="#c8eeff" stroke-width="0.7" stroke-opacity="0.55"/>
      </svg>
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Spaceship</span>
        <span class="gadget-tooltip-hint">Click &amp; drag to fly</span>
      </div>
    </div>
    <div class="gadget-slot" data-gadget="comet" id="gadget-comet">
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Comet</span>
        <span class="gadget-tooltip-hint">Drag to throw</span>
      </div>
    </div>
    <div class="gadget-slot" data-gadget="meteor-shower" id="gadget-meteor-shower">
      <div class="cooldown-ring"></div>
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Meteor Shower</span>
        <span class="gadget-tooltip-hint">Drag to aim</span>
      </div>
    </div>
    <div class="gadget-slot" data-gadget="asteroid" id="gadget-asteroid">
      <svg class="gadget-asteroid-icon" viewBox="-20 -20 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,-18 10,-13 17,-4 15,9 6,17 -7,16 -16,7 -15,-6 -8,-16"
          fill="rgba(0,28,32,0.85)"
          stroke="#00f5ff" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="3" cy="-4" r="2.5" fill="rgba(0,245,255,0.12)" stroke="#00f5ff" stroke-width="0.8"/>
        <circle cx="-5" cy="6" r="1.5" fill="rgba(0,245,255,0.10)" stroke="#00f5ff" stroke-width="0.6"/>
      </svg>
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Asteroid</span>
        <span class="gadget-tooltip-hint">Click to spawn</span>
      </div>
    </div>
  </div>

  <script src="moon.js"></script>
  <script src="globe.js"></script>
  <script src="blackhole.js"></script>
  <script src="comet.js"></script>
  <script src="asteroids.js"></script>
  <script src="spaceship.js"></script>
  <script src="meteor-shower.js"></script>
  <script src="gadgets.js"></script>
  <script src="stars.js"></script>
</body>
</html>
